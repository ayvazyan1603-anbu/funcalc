name: Build FunPay Calculator Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Save Log to Branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B debug-log
          git add -f gradle.log || true
          git commit -m "Add build log" || true
          git push -f origin debug-log || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log

      - name: Inspect Build Output and Collect APK
        run: |
          mkdir -p apks
          echo "=== Find all files in android/app/build ==="
          find android/app/build -type f || true
          echo "=== Find all .apk files ==="
          find . -name "*.apk" -type f
          find . -name "*.apk" -type f -exec cp {} apks/ \;
          echo "=== APKS directory contents ==="
          ls -la apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunPay-Calculator-v1.0-APK
          path: apks
          retention-days: 30
